[project]
name = "harbor-market"
version = "0.1.0"
description = "A harbor trading domain with Django adapters"
requires-python = ">=3.14"
dependencies = ["django>=6.1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "mypy",
    "django-stubs",
    "import-linter",
    "defusedxml",
    "types-defusedxml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests Django ORM persistence and transactions"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "manage.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Only rules the tool itself declares incompatible are left out; no code is excluded.
ignore = [
  # D203 and D211 are mutually exclusive (Ruff warns); keep D211 (no blank line before a class docstring).
  "D203",
  # D212 and D213 are mutually exclusive (Ruff warns); keep D212 (summary on the first line).
  "D213",
  # Conflicts with `ruff format` (Ruff documents it as unsafe to combine with the formatter).
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
# pytest checks are written as `assert` statements (PT009/PT027 forbid the unittest forms),
# which S101 forbids: the two rule families ask for opposite things in tests, so tests keep
# the pytest style. Production code keeps S101.
"tests/**" = ["S101"]

[tool.importlinter]
root_package = "harbor_market"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Adapters point inward and remain independent"
type = "layers"
containers = ["harbor_market"]
layers = ["composition", "presentation | infrastructure", "application", "domain"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Core excludes Django and direct database access"
type = "forbidden"
source_modules = ["harbor_market.domain", "harbor_market.application"]
forbidden_modules = ["django", "sqlite3"]
