[project]
name = "harbor-market"
version = "0.1.0"
description = "A harbor trading domain with Django adapters"
requires-python = ">=3.14"
dependencies = ["django>=6.1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-django", "ruff", "mypy", "django-stubs", "import-linter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "manage.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.importlinter]
root_package = "harbor_market"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Adapters point inward and remain independent"
type = "layers"
containers = ["harbor_market"]
layers = ["composition", "presentation | infrastructure", "application", "domain"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Core excludes Django and direct database access"
type = "forbidden"
source_modules = ["harbor_market.domain", "harbor_market.application"]
forbidden_modules = ["django", "sqlite3"]
